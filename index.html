<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <title>我的個人式網頁</title>
    <!-- 引入 Chart.js 用於製作統計圖表 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 基礎樣式與重設 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; }
        
        /* 頁首與導覽列 */
        header { background: #2c3e50; color: white; text-align: center; padding: 2rem; }
        nav { background: #34495e; padding: 0.5rem; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #1abc9c; }

        /* 主要彈性佈局 (RWD 核心) */
        .container { display: flex; flex-wrap: wrap; max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        main { flex: 3; background: white; padding: 20px; border-radius: 8px; margin-right: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        aside { flex: 1.5; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 多媒體區塊 */
        .media-section { margin-bottom: 30px; }
        .media-section img { max-width: 100%; height: auto; border-radius: 5px; margin-top: 10px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 10px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 5px; }

        /* 頁尾 */
        footer { background: #2c3e50; color: white; text-align: center; padding: 1rem; margin-top: 40px; }

        /* 響應式斷點設定：當螢幕小於 768px (手機/平板) */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            main { margin-right: 0; margin-bottom: 20px; }
            nav a { display: block; margin: 10px 0; }
        }
    </style>
</head>
<body>

<!DOCTYPE html>
<html>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<body>

<div id="myPlot" style="width:100%;max-width:700px"></div>

<script>
const xArray = ["遊戲", "輕小說", "課業"];
const yArray = [45, 35, 20,];

const data = [{
  x:xArray,
  y:yArray,
  type:"bar",
  orientation:"v",
  marker: {color:"rgba(0,0,255,0.6)"}
}];

const layout = {title:"World Wide Wine Production"};

Plotly.newPlot("myPlot", data, layout);
</script>
